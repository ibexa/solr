name: Solr integration tests

on:
    push:
        branches:
            - main
            - '[0-9]+.[0-9]+'
    pull_request: ~

jobs:
    solr-integration:
        name: "Integration tests"
        runs-on: "ubuntu-22.04"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.3'
                solr-version:
                    - '8.11.2'
                    - '9.10.1'
                    - '10.0.0'
                cores-setup:
                    - 'dedicated'
                    - 'shared'
                    - 'single'
                    - 'cloud'
                # Solr requires Java 8+ (Solr 8), 11+ (Solr 9) and 21+ (Solr 10)
                include:
                    - solr-version: '8.11.2'
                      java-version: '11'
                    - solr-version: '9.10.1'
                      java-version: '17'
                    - solr-version: '10.0.0'
                      java-version: '21'
        env:
            CORES_SETUP: ${{ matrix.cores-setup }}
            SOLR_VERSION: ${{ matrix.solr-version }}
        steps:
            - if: matrix.cores-setup == 'cloud'
              name: "Set up Solr Cloud"
              run: echo "SOLR_CLOUD=yes" >> $GITHUB_ENV

            - if: matrix.cores-setup == 'single'
              name: "Set up single core"
              run: echo "SOLR_CORES=collection1" >> $GITHUB_ENV

            - uses: actions/checkout@v7

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: ${{ matrix.java-version }}

            - name: Setup PHP Action
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: highest

            - name: Init Solr
              run: ./.github/init_solr.sh

            - name: Run integration test suite
              run: composer test-integration-solr
